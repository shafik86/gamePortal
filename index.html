<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🎮 Game Portal</span>
        </div>
    </nav>

    <!-- Game Grid -->
    <div class="container mt-5">
        <div class="row g-4">
            <!-- Tic Tac Toe -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body text-center">
                        <div class="game-thumb">❌⭕</div>
                        <h5 class="card-title mt-3">Tic Tac Toe</h5>
                        <p class="card-text">Classic 3x3 grid game</p>
                        <a href="games/tic-tac-toe/index.html" class="btn btn-primary">Play</a>
                    </div>
                </div>
            </div>

            <!-- Snake -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body text-center">
                        <div class="game-thumb">🐍</div>
                        <h5 class="card-title mt-3">Snake</h5>
                        <p class="card-text">Classic snake eating game</p>
                        <a href="games/snake/index.html" class="btn btn-primary">Play</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
